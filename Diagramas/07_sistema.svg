<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250"><rect width="100%" height="100%" fill="white"/><text x="25" y="35" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#12334d" text-anchor="start">De una senal física a un registro comprensible</text><rect x="20" y="90" width="210" height="90" rx="8" fill="#edf6fa" stroke="#12334d" stroke-width="2"/><text x="125" y="123" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#12334d" text-anchor="middle">Sonido</text><text x="125" y="155" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="middle">INMP441 / I2S</text><line x1="230" y1="135" x2="265" y2="135" stroke="#18a0b5" stroke-width="3"/><text x="247" y="127" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#12334d" text-anchor="start">&gt;</text><rect x="270" y="90" width="210" height="90" rx="8" fill="#edf6fa" stroke="#12334d" stroke-width="2"/><text x="375" y="123" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#12334d" text-anchor="middle">Movimiento</text><text x="375" y="155" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="middle">MPU6050 / I2C</text><line x1="480" y1="135" x2="515" y2="135" stroke="#18a0b5" stroke-width="3"/><text x="497" y="127" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#12334d" text-anchor="start">&gt;</text><rect x="520" y="90" width="210" height="90" rx="8" fill="#edf6fa" stroke="#12334d" stroke-width="2"/><text x="625" y="123" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#12334d" text-anchor="middle">ESP32-C3</text><text x="625" y="155" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="middle">Análisis temporal</text><line x1="730" y1="135" x2="765" y2="135" stroke="#18a0b5" stroke-width="3"/><text x="747" y="127" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#12334d" text-anchor="start">&gt;</text><rect x="770" y="90" width="210" height="90" rx="8" fill="#edf6fa" stroke="#12334d" stroke-width="2"/><text x="875" y="123" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#12334d" text-anchor="middle">Resultado</text><text x="875" y="155" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="middle">LED + BLE</text><text x="25" y="224" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">Sonido y movimiento se combinan en el ESP32-C3; no diagnostican miedo.</text></svg>