<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><rect width="100%" height="100%" fill="white"/><text x="25" y="35" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#12334d" text-anchor="start">H4 | Alimentación portátil, habilitacion condicionada</text><rect x="20" y="90" width="190" height="75" rx="8" fill="#edf6fa" stroke="#12334d" stroke-width="2"/><text x="115" y="120" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="middle">3 AAA</text><text x="115" y="145" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#12334d" text-anchor="middle">max. medido</text><rect x="230" y="90" width="190" height="75" rx="8" fill="#edf6fa" stroke="#12334d" stroke-width="2"/><text x="325" y="120" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="middle">F1 + D1</text><text x="325" y="145" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#12334d" text-anchor="middle">PTC + Schottky</text><rect x="460" y="90" width="190" height="75" rx="8" fill="#edf6fa" stroke="#12334d" stroke-width="2"/><text x="555" y="120" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="middle">S1</text><text x="555" y="145" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#12334d" text-anchor="middle">interruptor</text><rect x="690" y="90" width="190" height="75" rx="8" fill="#edf6fa" stroke="#12334d" stroke-width="2"/><text x="785" y="120" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="middle">5V / VBUS</text><text x="785" y="145" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#12334d" text-anchor="middle">LDO -&gt; 3V3</text><line x1="210" y1="127" x2="230" y2="127" stroke="#d75555" stroke-width="4"/><line x1="440" y1="127" x2="460" y2="127" stroke="#d75555" stroke-width="4"/><line x1="670" y1="127" x2="690" y2="127" stroke="#d75555" stroke-width="4"/><line x1="680" y1="127" x2="680" y2="215" stroke="#d75555" stroke-width="3"/><circle cx="680" cy="127" r="5" fill="#cda552"/><rect x="610" y="215" width="140" height="50" rx="8" fill="#edf6fa" stroke="#12334d" stroke-width="2"/><text x="680" y="246" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#12334d" text-anchor="middle">R1 150k</text><line x1="680" y1="265" x2="680" y2="300" stroke="#15334c" stroke-width="3"/><line x1="680" y1="300" x2="880" y2="300" stroke="#218ba7" stroke-width="3"/><text x="885" y="306" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#12334d" text-anchor="start">GPIO0</text><rect x="610" y="320" width="140" height="50" rx="8" fill="#edf6fa" stroke="#12334d" stroke-width="2"/><text x="680" y="351" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#12334d" text-anchor="middle">R2 100k</text><line x1="680" y1="300" x2="680" y2="320" stroke="#15334c" stroke-width="3"/><line x1="680" y1="370" x2="680" y2="400" stroke="#15334c" stroke-width="3"/><line x1="680" y1="400" x2="900" y2="400" stroke="#15334c" stroke-width="3"/><text x="905" y="406" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#12334d" text-anchor="start">GND</text><line x1="830" y1="300" x2="830" y2="335" stroke="#15334c" stroke-width="3"/><line x1="810" y1="335" x2="850" y2="335" stroke="#15334c" stroke-width="3"/><line x1="810" y1="347" x2="850" y2="347" stroke="#15334c" stroke-width="3"/><line x1="830" y1="347" x2="830" y2="400" stroke="#15334c" stroke-width="3"/><text x="852" y="350" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#12334d" text-anchor="start">100nF</text><text x="25" y="220" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="start">D1: ánodo hacia + pilas; banda/cátodo hacia S1.</text><text x="25" y="250" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="start">F1: PTC 0.5 A nominal, validar curva y caída.</text><text x="25" y="280" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="start">C1: 100 uF / 10 V entre nodo S1 y GND.</text><text x="25" y="310" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="start">Todos los negativos a GND. USB desconectado.</text><text x="25" y="340" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="start">El divisor mide DESPUÉS de F1, D1 y S1.</text><text x="25" y="370" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="start">No detecta inversion, temperatura ni corta la energía.</text></svg>