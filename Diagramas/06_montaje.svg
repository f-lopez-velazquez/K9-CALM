<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><rect width="100%" height="100%" fill="white"/><text x="30" y="35" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#12334d" text-anchor="start">Propuesta de montaje | maqueta sobre peluche, sin uso animal</text><rect x="100" y="90" width="800" height="260" rx="8" fill="#e5edf2" stroke="#12334d" stroke-width="2"/><rect x="130" y="195" width="740" height="55" rx="8" fill="#b9cbd6" stroke="#12334d" stroke-width="2"/><rect x="155" y="120" width="180" height="150" rx="8" fill="#174965" stroke="#12334d" stroke-width="2"/><text x="245.0" y="195.0" font-family="DejaVu Sans,sans-serif" font-size="17" fill="white" text-anchor="middle">3 AAA en caja</text><rect x="400" y="125" width="180" height="140" rx="8" fill="#174965" stroke="#12334d" stroke-width="2"/><text x="490.0" y="195.0" font-family="DejaVu Sans,sans-serif" font-size="17" fill="white" text-anchor="middle">ESP32-C3</text><rect x="650" y="125" width="130" height="65" rx="8" fill="#174965" stroke="#12334d" stroke-width="2"/><text x="715.0" y="157.5" font-family="DejaVu Sans,sans-serif" font-size="17" fill="white" text-anchor="middle">GY-521</text><rect x="650" y="235" width="130" height="65" rx="8" fill="#174965" stroke="#12334d" stroke-width="2"/><text x="715.0" y="267.5" font-family="DejaVu Sans,sans-serif" font-size="17" fill="white" text-anchor="middle">INMP441</text><text x="120" y="385" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">Caja aislante + alivio de tensión + fijación del sensor. Antena y puerto acústico libres.</text><text x="120" y="414" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#12334d" text-anchor="start">Sin bordes, piezas sueltas ni conductores expuestos. Retirar para programar por USB.</text></svg>