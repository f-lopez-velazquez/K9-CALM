<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><rect width="100%" height="100%" fill="white"/><text x="25" y="33" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#12334d" text-anchor="start">H1 | Componentes reales, conexiones identificadas</text><text x="35" y="82" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#12334d" text-anchor="start">GPIO10</text><line x1="35" y1="110" x2="150" y2="110" stroke="#d17b20" stroke-width="3"/><rect x="150" y="90" width="165" height="40" rx="8" fill="#e3c78f" stroke="#12334d" stroke-width="2"/><rect x="180" y="90" width="8" height="40" rx="0" fill="#d57c28" stroke="#d57c28" stroke-width="2"/><rect x="210" y="90" width="8" height="40" rx="0" fill="#d57c28" stroke="#d57c28" stroke-width="2"/><rect x="240" y="90" width="8" height="40" rx="0" fill="#854b1e" stroke="#854b1e" stroke-width="2"/><rect x="283" y="90" width="8" height="40" rx="0" fill="#c2a245" stroke="#c2a245" stroke-width="2"/><text x="232" y="162" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="middle">330 ohm</text><line x1="315" y1="110" x2="420" y2="110" stroke="#d17b20" stroke-width="3"/><path d="M 420 90 Q 450 45 480 90 L 480 125 L 420 125 Z" fill="#dc5a51" stroke="#8e3c37" stroke-width="3"/><line x1="420" y1="110" x2="420" y2="220" stroke="#956f4b" stroke-width="3"/><line x1="480" y1="125" x2="480" y2="220" stroke="#956f4b" stroke-width="3"/><line x1="480" y1="220" x2="550" y2="220" stroke="#15334c" stroke-width="3"/><text x="558" y="226" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">GND</text><text x="345" y="249" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">Ánodo (+)</text><text x="478" y="249" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">Cátodo (-)</text><text x="345" y="278" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#12334d" text-anchor="start">La pata larga suele ser +; confirmar.</text><text x="635" y="82" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#12334d" text-anchor="start">GPIO3</text><line x1="635" y1="110" x2="700" y2="110" stroke="#9163b0" stroke-width="3"/><circle cx="700" cy="110" r="5" fill="#cda552"/><line x1="700" y1="110" x2="758" y2="76" stroke="#9163b0" stroke-width="3"/><circle cx="775" cy="110" r="5" fill="#cda552"/><line x1="775" y1="110" x2="930" y2="110" stroke="#15334c" stroke-width="3"/><text x="880" y="143" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">GND</text><rect x="715" y="177" width="90" height="60" rx="8" fill="#353b44" stroke="#12334d" stroke-width="2"/><circle cx="760" cy="207" r="17" fill="#b1bac4"/><text x="638" y="273" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#12334d" text-anchor="start">Pulsador: abierto sin presionar.</text><text x="638" y="300" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#12334d" text-anchor="start">La entrada usa pull-up interno.</text><text x="25" y="346" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">Circuito equivalente: GPIO10 -&gt; 330 ohm -&gt; LED -&gt; GND. GPIO3 -&gt; pulsador -&gt; GND.</text></svg>