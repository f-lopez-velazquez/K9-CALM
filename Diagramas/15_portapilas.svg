<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect width="100%" height="100%" fill="white"/><text x="25" y="35" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#12334d" text-anchor="start">Portapilas 3 AAA + interruptor: identificar polaridad</text><rect x="70" y="75" width="430" height="245" rx="8" fill="#343d48" stroke="#12334d" stroke-width="2"/><rect x="100" y="100" width="330" height="45" rx="8" fill="#d3d9dd" stroke="#12334d" stroke-width="2"/><rect x="430" y="112" width="12" height="20" rx="8" fill="#c8b060" stroke="#12334d" stroke-width="2"/><text x="115" y="130" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#12334d" text-anchor="start">-</text><text x="400" y="130" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#12334d" text-anchor="start">+</text><text x="250" y="130" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#12334d" text-anchor="middle">AAA 1.5 V</text><rect x="100" y="165" width="330" height="45" rx="8" fill="#d3d9dd" stroke="#12334d" stroke-width="2"/><rect x="430" y="177" width="12" height="20" rx="8" fill="#c8b060" stroke="#12334d" stroke-width="2"/><text x="115" y="195" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#12334d" text-anchor="start">-</text><text x="400" y="195" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#12334d" text-anchor="start">+</text><text x="250" y="195" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#12334d" text-anchor="middle">AAA 1.5 V</text><rect x="100" y="230" width="330" height="45" rx="8" fill="#d3d9dd" stroke="#12334d" stroke-width="2"/><rect x="430" y="242" width="12" height="20" rx="8" fill="#c8b060" stroke="#12334d" stroke-width="2"/><text x="115" y="260" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#12334d" text-anchor="start">-</text><text x="400" y="260" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#12334d" text-anchor="start">+</text><text x="250" y="260" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#12334d" text-anchor="middle">AAA 1.5 V</text><text x="90" y="350" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">En serie: las tensiones se suman.</text><text x="90" y="380" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#12334d" text-anchor="start">Medir polaridad real; no confiar solo en colores.</text><line x1="500" y1="130" x2="580" y2="130" stroke="#d45454" stroke-width="3"/><rect x="580" y="95" width="150" height="70" rx="8" fill="#eef4f6" stroke="#12334d" stroke-width="2"/><text x="655" y="125" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#12334d" text-anchor="middle">F1 + D1</text><text x="655" y="150" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#12334d" text-anchor="middle">Protección</text><line x1="730" y1="130" x2="800" y2="130" stroke="#d45454" stroke-width="3"/><circle cx="800" cy="130" r="5" fill="#cda552"/><line x1="800" y1="130" x2="855" y2="95" stroke="#d45454" stroke-width="3"/><circle cx="870" cy="130" r="5" fill="#cda552"/><line x1="870" y1="130" x2="955" y2="130" stroke="#d45454" stroke-width="3"/><text x="810" y="190" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#12334d" text-anchor="start">S1 / SPST</text><text x="785" y="230" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">Al nodo Ventrada</text><line x1="500" y1="280" x2="955" y2="280" stroke="#344b59" stroke-width="3"/><text x="795" y="308" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#12334d" text-anchor="start">GND común</text><text x="545" y="365" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">No es cargador. No recargar alcalinas.</text><text x="545" y="395" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#12334d" text-anchor="start">USB retirado al conectar el portapilas.</text></svg>